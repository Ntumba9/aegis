# CI-only override (selected via COMPOSE_FILE in .github/workflows/ci.yml).
#
# docker-compose.yml marks lab-net `internal: true` so the lab has no route
# out, and also publishes lab-api/lab-db on 127.0.0.1. In the one CI run so
# far the lab containers started but http://localhost:8100 never answered,
# which is consistent with an internal network not publishing host ports.
# The CI runner is an ephemeral, isolated VM and the tests only need the
# published ports, so CI runs the lab on a normal bridge network. Local
# development keeps using docker-compose.yml unchanged.
networks:
  lab-net:
    internal: false
